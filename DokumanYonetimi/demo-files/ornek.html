<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><title>Demo Önizleme</title>
<style>body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:48px;background:#f4f6fb;color:#333}
.kart{max-width:620px;margin:40px auto;background:#fff;border-radius:8px;padding:32px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
h2{margin-top:0;color:#2a5db0}.etiket{display:inline-block;background:#ffc107;color:#222;border-radius:4px;padding:2px 8px;font-size:12px}</style></head>
<body><div class="kart"><span class="etiket">DEMO</span><h2>Örnek belge önizlemesi</h2>
<p>Bu bir <b>demo sürümüdür</b>. Gerçek sistemde burada yüklenen belgenin (Word, PDF, metin, resim) kendisi görüntülenir.</p>
<p>Seçilen dosya türü: <b id="tur">-</b></p></div>
<script>var m=/[?&]tur=([^&]*)/.exec(location.search);document.getElementById('tur').textContent=m?decodeURIComponent(m[1]):'-';</script></body></html>
